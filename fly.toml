# An example for running Gingham on Fly.io. Change the app name, then `fly launch --copy-config`.
# Secrets go in with `fly secrets import` from standard input: FRAME_MASTER_KEY, and for Google Tasks
# GINGHAM_GOOGLE_CLIENT_ID and GINGHAM_GOOGLE_CLIENT_SECRET. See docs/HOSTING.md.
app = "your-gingham"
primary_region = "dfw"

[env]
  FRAME_AUTH = "required"
  FRAME_DATA = "/data"
  PORT = "8080"
  # FRAME_URL = "https://frame.example.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "gingham_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
