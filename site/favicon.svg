<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gingham: two translucent bands crossing. -->
  <rect width="32" height="32" rx="7" fill="#fff"/>
  <g fill="#f2be3c" fill-opacity=".55">
    <rect x="0" y="0" width="8" height="32"/><rect x="16" y="0" width="8" height="32"/>
    <rect x="0" y="0" width="32" height="8"/><rect x="0" y="16" width="32" height="8"/>
  </g>
</svg>
